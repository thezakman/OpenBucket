[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbucket"
version = "3.0.0"
description = "Dump the contents of public/exposed cloud storage buckets (Amazon S3 and Oracle Cloud Object Storage)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "TheZakMan" }]
keywords = ["s3", "oracle", "bucket", "storage", "pentest", "security", "download"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.25",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/thezakman/OpenBucket"
Repository = "https://github.com/thezakman/OpenBucket"
Issues = "https://github.com/thezakman/OpenBucket/issues"

[project.scripts]
openbucket = "openbucket.cli:main"

[tool.setuptools]
packages = ["openbucket"]
